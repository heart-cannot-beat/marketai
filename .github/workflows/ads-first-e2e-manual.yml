name: Ads-first E2E (manual)

# The new opening (ADR 0018, #204) on the Compose stack whose web is built with
# NEXT_PUBLIC_MARKETAI_ADS_FIRST=true (docker-compose.ads-first.yml): an empty
# Workspace to two downloaded images, and (step 2, #259) two kept ads taken to
# a test, its package, two reports sent back, the result and the test history.
# Controlled Mock only. Manual only, like e2e-suites-manual.yml: it never runs
# on pull requests, pushes or a schedule, because the switch is off in
# production until the maintainer turns it on.
# ci.yml's golden-path-e2e keeps testing the switch-off build on every PR.
on:
  workflow_dispatch:

concurrency:
  group: ads-first-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ads-first:
    name: Ads-first Playwright scenario
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install control-plane dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Build and start compose stack (web with the switch on)
        run: >
          docker compose -p ads-first
          -f docker-compose.yml -f docker-compose.ads-first.yml
          --env-file deploy/docker/.env.compose
          up -d --build

      - name: Wait for all services
        run: scripts/compose-wait.sh 180 ads-first

      - name: Run the ads-first scenario
        working-directory: web
        env:
          CI: "true"
          E2E_STANDARD_GITHUB_RUNNER: "true"
          E2E_ADS_FIRST: "true"
          E2E_BASE_URL: http://localhost:4002
          E2E_DOMAIN_BASE_URL: http://localhost:8787
          E2E_COMPOSE_PROJECT: ads-first
          E2E_COMPOSE_FILE: ${{ github.workspace }}/docker-compose.yml
          E2E_COMPOSE_OVERRIDE_FILE: ${{ github.workspace }}/docker-compose.ads-first.yml
          CONTROL_PLANE_DATABASE_URL: postgresql://marketai_control_owner:compose_control_owner@localhost:5432/marketai_control
          DOMAIN_OWNER_DATABASE_URL: postgresql://marketai_domain_owner:compose_domain_owner@localhost:5432/marketai_domain
          MARKETAI_DATABASE_URL: postgresql+psycopg://marketai_domain_owner:compose_domain_owner@localhost:5432/marketai_domain
          CONTROL_PLANE_TO_DOMAIN_ENTITLEMENT_TOKEN: compose-entitlement-inbox-token
          ENTITLEMENT_SNAPSHOT_SIGNING_KEY: compose-entitlement-signing-key-32-bytes-minimum
          ENTITLEMENT_SNAPSHOT_SIGNING_KEY_ID: compose-beta-v1
          MFA_ENCRYPTION_KEY: Y29tcG9zZS1tZmEtZW5jcnlwdGlvbi1rZXktMzJiISE=
          MARKETAI_TENANT_CONTEXT_SECRET: compose-tenant-context-secret-32-bytes-min
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ads-first-report.json
        run: >
          npx playwright test
          --project ads-first
          --workers 1
          --reporter=html,json,github
          --output=test-results

      - name: Upload test results
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: ads-first-results
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 3

      - name: Collect compose logs on failure
        if: failure()
        run: docker compose -p ads-first logs --no-color > ads-first-compose-logs.txt 2>&1

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ads-first-compose-logs
          path: ads-first-compose-logs.txt
          retention-days: 3

      - name: Tear down
        if: always()
        run: docker compose -p ads-first down -v
