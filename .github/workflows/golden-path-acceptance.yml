name: Golden Path Formal Acceptance
on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: 'Release commit SHA to validate'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: golden-path-acceptance
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  COMPOSE_PROJECT: gp-accept-${{ github.run_id }}
  BROKER_SOCKET_DIR: /var/run/lifecycle-broker
  TOPOLOGY_ATTESTATION_DIR: /var/run/topology
  ARTIFACT_DIR: /tmp/gp-artifacts
  MAIL_SINK_TOKEN_FILE: ${{ github.workspace }}/secrets/mail_sink_token.txt

jobs:
  resolve-inputs:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 1
      - id: resolve
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:8}" >> "$GITHUB_OUTPUT"

  validate-contracts:
    needs: resolve-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-inputs.outputs.commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test-support/lifecycle-broker/package-lock.json

      - name: Build lifecycle broker
        run: |
          npm ci --prefix test-support/lifecycle-broker
          npm run build --prefix test-support/lifecycle-broker
      - name: Validate suite contracts
        run: |
          for area in library generation assets experiments localization scale; do
            test -f "web/e2e/${area}/suite-contract.ts" || {
              echo "Missing suite contract: web/e2e/${area}/suite-contract.ts"
              exit 1
            }
          done
          echo "All suite contracts present"
      - name: Validate JSON schemas
        run: |
          for schema in golden-path-report golden-path-evidence acceptance-manifest artifact-allowlist; do
            test -f "contracts/e2e/${schema}.schema.json" || {
              echo "Missing schema: contracts/e2e/${schema}.schema.json"
              exit 1
            }
          done
          echo "All JSON schemas present"

  golden-path:
    needs: [resolve-inputs, validate-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-inputs.outputs.commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test-support/lifecycle-broker/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build lifecycle broker for golden-path runtime
        run: |
          npm ci --prefix test-support/lifecycle-broker
          npm run build --prefix test-support/lifecycle-broker

      - name: Generate ephemeral keypair
        run: |
          sudo install -d -m 0777 "$TOPOLOGY_ATTESTATION_DIR" "$BROKER_SOCKET_DIR" "$ARTIFACT_DIR"
          openssl genpkey -algorithm Ed25519 \
            -out "$TOPOLOGY_ATTESTATION_DIR/private.pem" 2>/dev/null
          openssl pkey -in "$TOPOLOGY_ATTESTATION_DIR/private.pem" \
            -pubout -out "$TOPOLOGY_ATTESTATION_DIR/public.pem" 2>/dev/null

      - name: Generate mail-sink token
        run: |
          mkdir -p secrets
          head -c 32 /dev/urandom | base64 -w0 > secrets/mail_sink_token.txt

      - name: Start lifecycle broker
        run: |
          BROKER_SOCKET="$BROKER_SOCKET_DIR/broker.sock" \
            node test-support/lifecycle-broker/dist/broker.js &
          timeout 10 bash -c 'until [ -S "$BROKER_SOCKET_DIR/broker.sock" ]; do sleep 0.2; done'

      - name: Validate topology (Pass 1 — config)
        run: |
          python3 scripts/ci/validate_topology.py \
            --phase config \
            --project-name "$COMPOSE_PROJECT" \
            --compose-file docker-compose.yml \
            --compose-file docker-compose.golden-path.yml

      - name: Compose up
        run: |
          docker compose \
            -p "$COMPOSE_PROJECT" \
            -f docker-compose.yml \
            -f docker-compose.golden-path.yml \
            up -d --build --wait
        timeout-minutes: 10

      - name: Wait for service readiness
        run: |
          for svc in web api worker controlled-provider mail-sink; do
            deadline=$((SECONDS + 120))
            while true; do
              container_id="$(docker compose \
                -p "$COMPOSE_PROJECT" \
                -f docker-compose.yml \
                -f docker-compose.golden-path.yml \
                ps -q "$svc")"
              state="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || true)"
              if [[ "$state" == "healthy" ]] || [[ "$svc" == "worker" && "$state" == "running" ]]; then
                echo "$svc is $state"
                break
              fi
              if (( SECONDS >= deadline )); then
                echo "$svc did not become ready (state=${state:-missing})" >&2
                docker compose \
                  -p "$COMPOSE_PROJECT" \
                  -f docker-compose.yml \
                  -f docker-compose.golden-path.yml \
                  ps
                exit 1
              fi
              sleep 2
            done
          done

      - name: Validate topology (Pass 2 — live) and sign attestation
        run: |
          python3 scripts/ci/validate_topology.py \
            --phase live \
            --project-name "$COMPOSE_PROJECT" \
            --compose-file docker-compose.yml \
            --compose-file docker-compose.golden-path.yml \
            --private-key "$TOPOLOGY_ATTESTATION_DIR/private.pem" \
            --write-signed-attestation "$TOPOLOGY_ATTESTATION_DIR/attestation.json"

      - name: Run golden-path test
        run: |
          mkdir -p "$ARTIFACT_DIR"
          docker compose \
            -p "$COMPOSE_PROJECT" \
            -f docker-compose.yml \
            -f docker-compose.golden-path.yml \
            run --rm --no-deps \
            -e ARTIFACT_DIR=/results \
            -e COMMIT_SHA=${{ needs.resolve-inputs.outputs.commit_sha }} \
            -e COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT" \
            playwright \
            npx playwright test \
              --config=e2e/golden-path/playwright.config.golden.ts
        timeout-minutes: 40

      - name: Redact compose logs
        if: always()
        run: |
          docker compose \
            -p "$COMPOSE_PROJECT" \
            -f docker-compose.yml \
            -f docker-compose.golden-path.yml \
            logs --no-color > /tmp/raw-compose-logs.txt 2>&1 || true
          python3 scripts/ci/redact_compose_logs.py \
            --project-name "$COMPOSE_PROJECT" \
            --raw-input /tmp/raw-compose-logs.txt \
            --output "$ARTIFACT_DIR/logs/compose-logs-redacted.txt"

      - name: Verify artifacts
        if: always()
        id: verify
        run: |
          python3 scripts/ci/verify_golden_artifacts.py \
            --artifact-dir "$ARTIFACT_DIR"

      - name: Upload verified artifacts
        if: always() && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: golden-path-acceptance-${{ needs.resolve-inputs.outputs.short_sha }}
          path: ${{ env.ARTIFACT_DIR }}
          retention-days: 365
          if-no-files-found: error

      - name: Teardown
        if: always()
        run: |
          docker compose \
            -p "$COMPOSE_PROJECT" \
            -f docker-compose.yml \
            -f docker-compose.golden-path.yml \
            down -v --remove-orphans || true
          sudo rm -rf "$TOPOLOGY_ATTESTATION_DIR" "$BROKER_SOCKET_DIR"
          rm -rf secrets/

  assemble:
    needs: [resolve-inputs, golden-path]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-inputs.outputs.commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: golden-path-acceptance-${{ needs.resolve-inputs.outputs.short_sha }}
          path: /tmp/acceptance-artifacts
      - name: Generate acceptance manifest
        run: |
          python3 -c "
          import json, hashlib, os, datetime
          artifacts = {}
          for root, dirs, files in os.walk('/tmp/acceptance-artifacts'):
              for f in files:
                  path = os.path.join(root, f)
                  relpath = os.path.relpath(path, '/tmp/acceptance-artifacts')
                  with open(path, 'rb') as fh:
                      artifacts[relpath] = hashlib.sha256(fh.read()).hexdigest()
          manifest = {
              'schema_version': '1.0',
              'commit_sha': '${{ needs.resolve-inputs.outputs.commit_sha }}',
              'run_id': '${{ github.run_id }}',
              'timestamp': datetime.datetime.utcnow().isoformat() + 'Z',
              'environment': '${{ inputs.environment }}',
              'artifact_digests': artifacts,
          }
          with open('/tmp/acceptance-artifacts/acceptance-manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "
      - name: Upload acceptance manifest
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-manifest-${{ needs.resolve-inputs.outputs.short_sha }}
          path: /tmp/acceptance-artifacts/acceptance-manifest.json
          retention-days: 365
