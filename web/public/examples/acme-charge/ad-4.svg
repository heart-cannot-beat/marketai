<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Example ad: Can it live outside?">
  <!-- Fictional example for the start page (#195). Acme Charge is not a real brand. -->
  <rect width="400" height="500" fill="#fefce8"/>
  <rect x="28" y="56" width="300" height="88" rx="22" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>
  <text x="50" y="96" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">Can it live</text>
  <text x="50" y="126" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">outside?</text>
  <rect x="72" y="178" width="300" height="118" rx="22" fill="#0f766e"/>
  <text x="96" y="222" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700">Yes.</text>
  <text x="96" y="254" fill="#ccfbf1" font-family="Helvetica, Arial, sans-serif" font-size="17">IP55-rated enclosure</text>
