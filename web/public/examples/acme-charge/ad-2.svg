<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Example ad: Set it once.">
  <!-- Fictional example for the start page (#195). Acme Charge is not a real brand. -->
  <rect width="400" height="500" fill="#ecfdf5"/>
  <text x="32" y="78" fill="#064e3b" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700">Set it once.</text>
  <text x="32" y="112" fill="#065f46" font-family="Helvetica, Arial, sans-serif" font-size="17">Charging starts when power is cheapest.</text>
  <rect x="118" y="146" width="164" height="282" rx="26" fill="#0f172a"/>
  <rect x="130" y="166" width="140" height="244" rx="14" fill="#ffffff"/>
  <text x="144" y="198" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Schedule</text>
  <rect x="144" y="214" width="112" height="44" rx="10" fill="#d1fae5"/>
  <text x="154" y="242" fill="#064e3b" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">11 PM – 6 AM</text>
  <rect x="144" y="272" width="112" height="28" rx="14" fill="#e2e8f0"/>
  <circle cx="242" cy="286" r="11" fill="#0f766e"/>
  <text x="152" y="291" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="12">Every night</text>
  <rect x="144" y="316" width="112" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="144" y="316" width="78" height="10" rx="5" fill="#a3e635"/>
  <text x="144" y="348" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="11">Ready by 6 AM</text>
  <text x="32" y="462" fill="#0f766e" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Acme Charge Home</text>
  <text x="32" y="484" fill="#475569" font-family="Helvetica, Arial, sans-serif" font-size="14">acmecharge.example</text>
